name: Tests

on:
  # Push only on main: pull-request branches are covered by `pull_request`
  # below, so a PR commit never triggers two parallel CI runs.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: Swift tests
    # The app still targets macOS 15, but compilation needs the macOS 26 SDK
    # for APIs guarded by `#available(macOS 26, *)`.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift toolchain
        id: swift
        run: |
          swift --version
          echo "version=$(swift --version | head -1 | shasum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        uses: actions/cache@v5
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-

      - name: Run tests
        # Performance suites run explicitly from script/benchmark_*.sh;
        # keep the normal CI signal focused on deterministic product behavior.
        run: swift test --skip 'YuanGUIBenchmarks'
