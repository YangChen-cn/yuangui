name: Mirror release and update manifest to Gitee

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - updates/latest.json
      - .github/workflows/mirror-release-to-gitee.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag, for example v2.7.2"
        required: true
        type: string
      allow_rollback:
        description: "Allow a manifest version lower than or equal to the current stable version"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-update-manifest
  cancel-in-progress: false

jobs:
  mirror-release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.prerelease == false)
    name: Upload the same DMG and manifest to Gitee
    runs-on: macos-26
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      # Verified public repository and main branch. There is no Gitee remote
      # in this checkout, so keep the mirror destination explicit here.
      GITEE_OWNER: yangchen716
      GITEE_REPO: yuangui

    steps:
      - name: Check out the current GitHub main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG='${{ github.event.release.tag_name }}'
            ALLOW_ROLLBACK="false"
          else
            TAG='${{ inputs.tag }}'
            ALLOW_ROLLBACK='${{ inputs.allow_rollback }}'
          fi

          [[ "$TAG" == v* ]] || { echo "Release tag must start with v: $TAG" >&2; exit 1; }
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]] || {
            echo "Stable release tags must contain only numeric versions: $TAG" >&2
            exit 1
          }

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > github-release.json
          [[ "$(jq -r '.prerelease // false' github-release.json)" == "false" ]] || {
            echo "Stable update channel refuses prerelease GitHub Releases: $TAG" >&2
            exit 1
          }

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "allow_rollback=$ALLOW_ROLLBACK" >> "$GITHUB_OUTPUT"

      - name: Download the exact GitHub Release DMG
        id: asset
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'YuanGUI-*.dmg' \
            --dir dist
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RELEASE_NOTES*.md' \
            --dir dist || true

          DMG_COUNT="$(find dist -maxdepth 1 -type f -name 'YuanGUI-*.dmg' -print | wc -l | tr -d ' ')"
          if [[ "$DMG_COUNT" != "1" ]]; then
            echo "Expected exactly one YuanGUI-*.dmg, found $DMG_COUNT" >&2
            find dist -maxdepth 1 -type f -name 'YuanGUI-*.dmg' -print >&2
            exit 1
          fi

          DMG="$(find dist -maxdepth 1 -type f -name 'YuanGUI-*.dmg' -print -quit)"
          ASSET_NAME="$(basename "$DMG")"
          SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          SIZE="$(stat -f '%z' "$DMG")"
          printf '%s  %s\n' "$SHA256" "$ASSET_NAME" > "$DMG.sha256"

          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Downloaded $ASSET_NAME ($SIZE bytes, $SHA256)"

      - name: Validate DMG bundle metadata and signature
        id: bundle
        env:
          DMG: ${{ steps.asset.outputs.dmg }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ATTACH_PLIST="$(mktemp)"
          MOUNT_POINT=""
          cleanup() {
            if [[ -n "$MOUNT_POINT" ]]; then
              hdiutil detach "$MOUNT_POINT" -quiet || true
            fi
            rm -f "$ATTACH_PLIST"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -nobrowse -readonly -plist > "$ATTACH_PLIST"
          MOUNT_POINT="$(python3 - "$ATTACH_PLIST" <<'PY'
          import plistlib
          import sys
          with open(sys.argv[1], "rb") as handle:
              plist = plistlib.load(handle)
          for entity in plist.get("system-entities", []):
              mount_point = entity.get("mount-point")
              if mount_point:
                  print(mount_point)
                  break
          else:
              raise SystemExit("DMG did not expose a mount point")
          PY
          )"

          APP="$MOUNT_POINT/YuanGUI.app"
          INFO_PLIST="$APP/Contents/Info.plist"
          [[ -d "$APP" && -f "$INFO_PLIST" ]] || {
            echo "DMG does not contain YuanGUI.app" >&2
            exit 1
          }

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          BUNDLE_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"
          MINIMUM_SYSTEM_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$INFO_PLIST")"

          [[ "$BUNDLE_ID" == "com.yang.yuangui" ]] || {
            echo "Unexpected bundle identifier: $BUNDLE_ID" >&2
            exit 1
          }
          [[ "$BUNDLE_VERSION" == "$EXPECTED_VERSION" ]] || {
            echo "DMG version $BUNDLE_VERSION does not match tag version $EXPECTED_VERSION" >&2
            exit 1
          }
          [[ "$BUNDLE_BUILD" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid CFBundleVersion in DMG: $BUNDLE_BUILD" >&2
            exit 1
          }
          [[ "$MINIMUM_SYSTEM_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]] || {
            echo "Invalid LSMinimumSystemVersion in DMG: $MINIMUM_SYSTEM_VERSION" >&2
            exit 1
          }
          codesign --verify --deep --strict "$APP"

          echo "build=$BUNDLE_BUILD" >> "$GITHUB_OUTPUT"
          echo "minimum_system_version=$MINIMUM_SYSTEM_VERSION" >> "$GITHUB_OUTPUT"
          echo "DMG metadata verified: version=$BUNDLE_VERSION build=$BUNDLE_BUILD minimum=$MINIMUM_SYSTEM_VERSION"

      - name: Validate the Gitee token
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GITEE_TOKEN:-}" ]] || {
            echo "Repository secret GITEE_TOKEN is required" >&2
            exit 1
          }

      - name: Request Gitee source mirror before creating the release
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            "$API/remote_mirror/pull" >/dev/null || true

      - name: Wait briefly for the Gitee tag
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          for attempt in $(seq 1 8); do
            TAGS_FILE="$(mktemp)"
            if curl --silent --show-error --fail \
              "$API/tags?per_page=100" > "$TAGS_FILE" \
              && jq -e --arg tag "$TAG" '.[] | select(.name == $tag)' "$TAGS_FILE" >/dev/null 2>&1; then
              echo "Gitee tag $TAG is available"
              break
            fi
            if [[ "$attempt" == 8 ]]; then
              echo "::warning::Gitee tag $TAG is not visible yet; the release API will try to create it."
              break
            fi
            sleep 15
          done

      - name: Create or reuse the Gitee release
        id: gitee_release
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          RELEASES_FILE="$(mktemp)"
          curl --silent --show-error --fail-with-body \
            "$API/releases?per_page=100" > "$RELEASES_FILE"
          RELEASE_ID="$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' "$RELEASES_FILE" | head -n 1)"

          if [[ -z "$RELEASE_ID" || "$RELEASE_ID" == "null" ]]; then
            RELEASE_NAME="$(jq -r '.name // .tag_name' github-release.json)"
            RELEASE_BODY="$(jq -r '.body // ""' github-release.json)"
            PRERELEASE="$(jq -r '.prerelease // false' github-release.json)"
            curl --silent --show-error --fail-with-body \
              --request POST \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "name=$RELEASE_NAME" \
              --data-urlencode "body=$RELEASE_BODY" \
              --data-urlencode "target_commitish=main" \
              --data-urlencode "prerelease=$PRERELEASE" \
              "$API/releases" > gitee-release.json
            RELEASE_ID="$(jq -er '.id' gitee-release.json)"
          else
            jq -c --arg tag "$TAG" '.[] | select(.tag_name == $tag)' "$RELEASES_FILE" > gitee-release.json
          fi

          rm -f "$RELEASES_FILE"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload the DMG and checksum to Gitee
        id: gitee_asset
        env:
          API: https://gitee.com/api/v5/repos/${{ env.GITEE_OWNER }}/${{ env.GITEE_REPO }}
          RELEASE_ID: ${{ steps.gitee_release.outputs.release_id }}
          DMG: ${{ steps.asset.outputs.dmg }}
          ASSET_NAME: ${{ steps.asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          upload_if_validated() {
            local path="$1"
            local expected_size="$2"
            local expected_sha="$3"
            local name
            name="$(basename "$path")"

            local existing
            existing="$(jq -c --arg name "$name" '(.assets // []) | map(select(.name == $name)) | first // empty' gitee-release.json)"
            if [[ -n "$existing" ]]; then
              local existing_id
              local existing_url
              existing_id="$(jq -r '.id // empty' <<< "$existing")"
              existing_url="$(jq -r '(.browser_download_url // .url // empty)' <<< "$existing")"
              local existing_file
              existing_file="$(mktemp)"
              if [[ -n "$existing_url" ]] \
                && curl --silent --show-error --fail --location --retry 3 \
                  --connect-timeout 15 --max-time 300 "$existing_url" --output "$existing_file" \
                && [[ "$(stat -f '%z' "$existing_file")" == "$expected_size" ]] \
                && [[ "$(shasum -a 256 "$existing_file" | awk '{print $1}')" == "$expected_sha" ]]; then
                rm -f "$existing_file"
                echo "Reusing verified Gitee asset $name"
                return
              fi
              rm -f "$existing_file"

              [[ -n "$existing_id" ]] || {
                echo "Gitee asset $name exists but has no deletable id" >&2
                exit 1
              }
              echo "Replacing stale Gitee asset $name"
              curl --silent --show-error --fail-with-body \
                --connect-timeout 15 --max-time 300 \
                --request DELETE \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                "$API/releases/$RELEASE_ID/attach_files/$existing_id" >/dev/null
            fi
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 300 \
              --request POST \
              --form "access_token=$GITEE_TOKEN" \
              --form "file=@$path" \
              "$API/releases/$RELEASE_ID/attach_files" >/dev/null
          }

          CHECKSUM_SIZE="$(stat -f '%z' "$DMG.sha256")"
          CHECKSUM_SHA="$(shasum -a 256 "$DMG.sha256" | awk '{print $1}')"
          upload_if_validated "$DMG" "${{ steps.asset.outputs.size }}" "${{ steps.asset.outputs.sha256 }}"
          upload_if_validated "$DMG.sha256" "$CHECKSUM_SIZE" "$CHECKSUM_SHA"
          curl --silent --show-error --fail-with-body \
            "$API/releases/$RELEASE_ID" > gitee-release.json

          GITEE_DMG_URL="$(jq -r --arg name "$ASSET_NAME" \
            '(.assets // [])[] | select(.name == $name) | (.browser_download_url // .url // empty)' \
            gitee-release.json | head -n 1)"
          [[ "$GITEE_DMG_URL" == https://gitee.com/* ]] || {
            echo "Gitee did not return a usable HTTPS DMG URL" >&2
            exit 1
          }
          echo "url=$GITEE_DMG_URL" >> "$GITHUB_OUTPUT"

      - name: Verify Gitee contains the same DMG bytes
        env:
          GITEE_DMG_URL: ${{ steps.gitee_asset.outputs.url }}
          EXPECTED_SHA256: ${{ steps.asset.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.asset.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --retry 3 \
            --connect-timeout 15 --max-time 300 \
            "$GITEE_DMG_URL" --output dist/gitee-verified.dmg
          [[ "$(stat -f '%z' dist/gitee-verified.dmg)" == "$EXPECTED_SIZE" ]] || {
            echo "Gitee DMG size differs from GitHub DMG" >&2
            exit 1
          }
          [[ "$(shasum -a 256 dist/gitee-verified.dmg | awk '{print $1}')" == "$EXPECTED_SHA256" ]] || {
            echo "Gitee DMG SHA-256 differs from GitHub DMG" >&2
            exit 1
          }

      - name: Extract localized highlights from the release
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re

          with open("github-release.json", encoding="utf-8") as handle:
              body = json.load(handle).get("body") or ""

          def clean(line):
              line = re.sub(r"^\s*(?:[-*+]\s+|\d+[.)]\s+)", "", line.strip())
              line = re.sub(r"[`*_#]", "", line)
              line = re.sub(r"\s+", " ", line).strip()
              if not line:
                  return None
              if len(line) <= 120:
                  return line
              shortened = line[:119].rstrip()
              if re.search(r"[A-Za-z]", shortened):
                  word_boundary = shortened.rsplit(" ", 1)[0].rstrip()
                  if len(word_boundary) >= 40:
                      shortened = word_boundary
              return shortened + "…"

          def bullets(text):
              values = []
              for line in text.splitlines():
                  if re.match(r"^\s*(?:[-*+]\s+|\d+[.)]\s+)", line):
                      value = clean(line)
                      if value and value not in values:
                          values.append(value)
                  if len(values) == 2:
                      break
              return values

          zh_file = "dist/RELEASE_NOTES.zh-CN.md"
          en_file = "dist/RELEASE_NOTES.md"
          if os.path.exists(zh_file):
              with open(zh_file, encoding="utf-8") as handle:
                  zh = bullets(handle.read())
          else:
              zh = []
          if os.path.exists(en_file):
              with open(en_file, encoding="utf-8") as handle:
                  en = bullets(handle.read())
          else:
              en = []
          fallback = bullets(body)
          zh = zh or fallback
          en = en or fallback
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("zh_json=" + json.dumps(zh, ensure_ascii=False, separators=(",", ":")) + "\n")
              output.write("en_json=" + json.dumps(en, ensure_ascii=False, separators=(",", ":")) + "\n")
          PY

      - name: Refresh latest.json on GitHub main
        env:
          UPDATE_VERSION: ${{ steps.metadata.outputs.version }}
          UPDATE_BUILD: ${{ steps.bundle.outputs.build }}
          UPDATE_MINIMUM_SYSTEM_VERSION: ${{ steps.bundle.outputs.minimum_system_version }}
          ALLOW_ROLLBACK: ${{ steps.metadata.outputs.allow_rollback }}
          DMG_PATH: ${{ steps.asset.outputs.dmg }}
          GITHUB_DMG_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.metadata.outputs.tag }}/${{ steps.asset.outputs.asset_name }}
          GITEE_DMG_URL: ${{ steps.gitee_asset.outputs.url }}
          UPDATE_RELEASE_PAGE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.metadata.outputs.tag }}
          UPDATE_HIGHLIGHTS_ZH_JSON: ${{ steps.notes.outputs.zh_json }}
          UPDATE_HIGHLIGHTS_EN_JSON: ${{ steps.notes.outputs.en_json }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          ALLOW_ROLLBACK="$ALLOW_ROLLBACK" UPDATE_VERSION="$UPDATE_VERSION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def version_key(value):
              parts = [int(part) for part in value.split(".")]
              return tuple(parts + [0] * (3 - len(parts)))

          current = json.loads(Path("updates/latest.json").read_text(encoding="utf-8"))["version"]
          candidate = os.environ["UPDATE_VERSION"]
          if os.environ.get("ALLOW_ROLLBACK", "false").lower() != "true" and version_key(candidate) <= version_key(current):
              raise SystemExit(
                  f"Refusing to publish non-increasing stable version {candidate}; current manifest is {current}. "
                  "Use allow_rollback only for an intentional rollback."
              )
          PY

          ./script/generate_update_manifest.sh
          ./script/verify_update_manifest.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          if git diff --cached --quiet; then
            echo "updates/latest.json is already current"
          else
            git commit -m "Publish update manifest for $UPDATE_VERSION"
            git push origin HEAD:main
          fi

      - name: Request Gitee mirror refresh
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            "$API/remote_mirror/pull" >/dev/null || true

      - name: Ensure latest.json is available from Gitee raw
        shell: bash
        run: |
          set -euo pipefail
          RAW_URL="https://gitee.com/$GITEE_OWNER/$GITEE_REPO/raw/main/updates/latest.json"
          EXPECTED_SHA="$(shasum -a 256 updates/latest.json | awk '{print $1}')"
          RAW_FILE="$(mktemp)"
          FOUND=false

          for attempt in $(seq 1 10); do
            if curl --silent --show-error --fail --location "$RAW_URL" --output "$RAW_FILE" \
              && [[ "$(shasum -a 256 "$RAW_FILE" | awk '{print $1}')" == "$EXPECTED_SHA" ]]; then
              FOUND=true
              break
            fi
            sleep 15
          done

          # A Gitee repository without a configured remote mirror can still be
          # updated safely through its contents API. This only writes the
          # generated manifest and never uploads a guessed asset.
          if [[ "$FOUND" != true ]]; then
            API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
            FILE_INFO="$(mktemp)"
            curl --silent --show-error "$API/contents/updates/latest.json?ref=main" > "$FILE_INFO" || true
            FILE_SHA="$(jq -r '.sha // empty' "$FILE_INFO")"
            CONTENT="$(base64 < updates/latest.json | tr -d '\n')"
            if [[ -n "$FILE_SHA" ]]; then
              curl --silent --show-error --fail-with-body \
                --request PUT \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "content=$CONTENT" \
                --data-urlencode "message=Publish update manifest for ${{ steps.metadata.outputs.version }}" \
                --data-urlencode "branch=main" \
                --data-urlencode "sha=$FILE_SHA" \
                "$API/contents/updates/latest.json" >/dev/null
            else
              curl --silent --show-error --fail-with-body \
                --request POST \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "content=$CONTENT" \
                --data-urlencode "message=Publish update manifest for ${{ steps.metadata.outputs.version }}" \
                --data-urlencode "branch=main" \
                "$API/contents/updates/latest.json" >/dev/null
            fi
            rm -f "$FILE_INFO"
          fi

          for attempt in $(seq 1 10); do
            if curl --silent --show-error --fail --location "$RAW_URL" --output "$RAW_FILE" \
              && [[ "$(shasum -a 256 "$RAW_FILE" | awk '{print $1}')" == "$EXPECTED_SHA" ]]; then
              FOUND=true
              break
            fi
            sleep 15
          done
          rm -f "$RAW_FILE"
          [[ "$FOUND" == true ]] || {
            echo "Gitee raw manifest was not available or did not match GitHub" >&2
            exit 1
          }
          echo "Gitee manifest: $RAW_URL"

  sync-manifest:
    if: github.event_name == 'push'
    name: Sync latest.json to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: yangchen716
      GITEE_REPO: yuangui

    steps:
      - name: Check out the pushed main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate the Gitee token and manifest
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GITEE_TOKEN:-}" ]] || {
            echo "Repository secret GITEE_TOKEN is required" >&2
            exit 1
          }
          ./script/verify_update_manifest.sh

      - name: Create or update the Gitee raw manifest
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          RAW_URL="https://gitee.com/$GITEE_OWNER/$GITEE_REPO/raw/main/updates/latest.json"
          EXPECTED_SHA="$(sha256sum updates/latest.json | awk '{print $1}')"
          RAW_FILE="$(mktemp)"
          FOUND=false

          curl --silent --show-error --fail-with-body \
            --request POST \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            "$API/remote_mirror/pull" >/dev/null || true

          for attempt in $(seq 1 8); do
            if curl --silent --show-error --fail --location "$RAW_URL" --output "$RAW_FILE" \
              && [[ "$(sha256sum "$RAW_FILE" | awk '{print $1}')" == "$EXPECTED_SHA" ]]; then
              FOUND=true
              break
            fi
            sleep 15
          done

          if [[ "$FOUND" != true ]]; then
            FILE_INFO="$(mktemp)"
            curl --silent --show-error "$API/contents/updates/latest.json?ref=main" > "$FILE_INFO" || true
            FILE_SHA="$(jq -r '.sha // empty' "$FILE_INFO" 2>/dev/null || true)"
            CONTENT="$(base64 < updates/latest.json | tr -d '\n')"
            if [[ -n "$FILE_SHA" ]]; then
              curl --silent --show-error --fail-with-body \
                --request PUT \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "content=$CONTENT" \
                --data-urlencode "message=Sync update manifest" \
                --data-urlencode "branch=main" \
                --data-urlencode "sha=$FILE_SHA" \
                "$API/contents/updates/latest.json" >/dev/null
            else
              curl --silent --show-error --fail-with-body \
                --request POST \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "content=$CONTENT" \
                --data-urlencode "message=Create update manifest" \
                --data-urlencode "branch=main" \
                "$API/contents/updates/latest.json" >/dev/null
            fi
          fi

          for attempt in $(seq 1 8); do
            if curl --silent --show-error --fail --location "$RAW_URL" --output "$RAW_FILE" \
              && [[ "$(sha256sum "$RAW_FILE" | awk '{print $1}')" == "$EXPECTED_SHA" ]]; then
              FOUND=true
              break
            fi
            sleep 15
          done
          rm -f "$RAW_FILE"
          [[ "$FOUND" == true ]] || {
            echo "Gitee raw manifest was not created or does not match GitHub" >&2
            exit 1
          }
