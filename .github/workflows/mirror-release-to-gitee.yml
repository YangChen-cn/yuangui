name: Mirror release and update manifest to Gitee

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - updates/latest.json
      - .github/workflows/mirror-release-to-gitee.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag, for example v2.7.2"
        required: true
        type: string
      build:
        description: "CFBundleVersion from the DMG"
        required: true
        type: string
      minimum_system_version:
        description: "LSMinimumSystemVersion"
        required: false
        default: "15.0"
        type: string
      allow_rollback:
        description: "Allow a manifest version lower than the current stable version"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-update-manifest
  cancel-in-progress: false

jobs:
  mirror-release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.prerelease == false)
    name: Upload the same DMG and manifest to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      # Verified public repository and main branch. There is no Gitee remote
      # in this checkout, so keep the mirror destination explicit here.
      GITEE_OWNER: yangchen716
      GITEE_REPO: yuangui

    steps:
      - name: Check out the current GitHub main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG='${{ github.event.release.tag_name }}'
            BUILD=""
            MINIMUM_SYSTEM_VERSION="15.0"
            ALLOW_ROLLBACK="false"
          else
            TAG='${{ inputs.tag }}'
            BUILD='${{ inputs.build }}'
            MINIMUM_SYSTEM_VERSION='${{ inputs.minimum_system_version }}'
            ALLOW_ROLLBACK='${{ inputs.allow_rollback }}'
          fi

          [[ "$TAG" == v* ]] || { echo "Release tag must start with v: $TAG" >&2; exit 1; }
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]] || {
            echo "Stable release tags must contain only numeric versions: $TAG" >&2
            exit 1
          }

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > github-release.json
          [[ "$(jq -r '.prerelease // false' github-release.json)" == "false" ]] || {
            echo "Stable update channel refuses prerelease GitHub Releases: $TAG" >&2
            exit 1
          }
          PUBLISHED_AT="$(jq -r '.published_at // empty' github-release.json)"
          [[ -n "$PUBLISHED_AT" ]] || {
            echo "GitHub Release $TAG does not contain a publication timestamp" >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            BUILD="$(python3 - <<'PY'
          import json, re
          with open("github-release.json", encoding="utf-8") as handle:
              body = json.load(handle).get("body") or ""
          match = re.search(r"(?im)^\s*(?:build|cfbundleversion)\s*[:=]\s*([0-9]+)\s*$", body)
          print(match.group(1) if match else "")
          PY
            )"

            # Same-version manual repairs may reuse the already published
            # manifest metadata. New releases must carry an explicit build
            # in the Release body; never guess a new build from source files.
            if [[ -z "$BUILD" ]]; then
              CURRENT_VERSION="$(jq -r '.version // empty' updates/latest.json)"
              if [[ "$VERSION" == "$CURRENT_VERSION" ]]; then
                BUILD="$(jq -r '.build // empty' updates/latest.json)"
                MINIMUM_SYSTEM_VERSION="$(jq -r '.minimumSystemVersion // 15.0' updates/latest.json)"
              fi
            fi
          fi

          [[ "$BUILD" =~ ^[1-9][0-9]*$ ]] || {
            echo "A positive CFBundleVersion is required. Add 'Build: N' to the release body or provide workflow_dispatch.build." >&2
            exit 1
          }
          [[ "$MINIMUM_SYSTEM_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]] || {
            echo "Invalid minimum system version: $MINIMUM_SYSTEM_VERSION" >&2
            exit 1
          }

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "minimum_system_version=$MINIMUM_SYSTEM_VERSION" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"
          echo "allow_rollback=$ALLOW_ROLLBACK" >> "$GITHUB_OUTPUT"

      - name: Download the exact GitHub Release DMG
        id: asset
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          DMG_COUNT="$(jq '[.assets[] | select(.name | test("^YuanGUI-.*\\.dmg$"; "i"))] | length' github-release.json)"
          if [[ "$DMG_COUNT" != "1" ]]; then
            echo "Expected exactly one YuanGUI-*.dmg, found $DMG_COUNT" >&2
            jq -r '.assets[]?.name' github-release.json >&2
            exit 1
          fi

          ASSET_NAME="$(jq -r '[.assets[] | select(.name | test("^YuanGUI-.*\\.dmg$"; "i"))][0].name' github-release.json)"
          DMG_URL="$(jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .browser_download_url' github-release.json)"
          [[ "$DMG_URL" == https://github.com/* ]] || {
            echo "GitHub DMG asset does not use the expected HTTPS URL" >&2
            exit 1
          }
          DMG="dist/$ASSET_NAME"
          curl --silent --show-error --fail --location --retry 3 \
            --connect-timeout 20 --max-time 1200 \
            "$DMG_URL" --output "$DMG"

          for notes_name in RELEASE_NOTES.md RELEASE_NOTES.zh-CN.md; do
            notes_url="$(jq -r --arg name "$notes_name" '.assets[] | select(.name == $name) | .browser_download_url' github-release.json | head -n 1)"
            [[ -n "$notes_url" && "$notes_url" != "null" ]] || {
              echo "GitHub Release $TAG must include $notes_name" >&2
              exit 1
            }
            curl --silent --show-error --fail --location --retry 2 \
              --connect-timeout 15 --max-time 120 \
              "$notes_url" --output "dist/$notes_name"
          done

          SHA256="$(sha256sum "$DMG" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$DMG")"
          printf '%s  %s\n' "$SHA256" "$ASSET_NAME" > "$DMG.sha256"

          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Downloaded $ASSET_NAME ($SIZE bytes, $SHA256)"

      - name: Validate the Gitee token
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GITEE_TOKEN:-}" ]] || {
            echo "Repository secret GITEE_TOKEN is required" >&2
            exit 1
          }

      - name: Request Gitee source mirror before creating the release
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 15 --max-time 120 \
            --request POST \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            "$API/remote_mirror/pull" >/dev/null || true

      - name: Wait briefly for the Gitee tag
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          for attempt in $(seq 1 8); do
            TAGS_FILE="$(mktemp)"
            if curl --silent --show-error --fail \
              --connect-timeout 15 --max-time 60 \
              "$API/tags?per_page=100" > "$TAGS_FILE" \
              && jq -e --arg tag "$TAG" '.[] | select(.name == $tag)' "$TAGS_FILE" >/dev/null 2>&1; then
              echo "Gitee tag $TAG is available"
              break
            fi
            if [[ "$attempt" == 8 ]]; then
              echo "::warning::Gitee tag $TAG is not visible yet; the release API will try to create it."
              break
            fi
            sleep 15
          done

      - name: Create or reuse the Gitee release
        id: gitee_release
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          RELEASES_FILE="$(mktemp)"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 15 --max-time 120 \
            "$API/releases?per_page=100" > "$RELEASES_FILE"
          RELEASE_ID="$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' "$RELEASES_FILE" | head -n 1)"

          if [[ -z "$RELEASE_ID" || "$RELEASE_ID" == "null" ]]; then
            RELEASE_NAME="$(jq -r '.name // .tag_name' github-release.json)"
            RELEASE_BODY="$(jq -r '.body // ""' github-release.json)"
            PRERELEASE="$(jq -r '.prerelease // false' github-release.json)"
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 120 \
              --request POST \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "name=$RELEASE_NAME" \
              --data-urlencode "body=$RELEASE_BODY" \
              --data-urlencode "target_commitish=main" \
              --data-urlencode "prerelease=$PRERELEASE" \
              "$API/releases" > gitee-release.json
            RELEASE_ID="$(jq -er '.id' gitee-release.json)"
          else
            jq -c --arg tag "$TAG" '.[] | select(.tag_name == $tag)' "$RELEASES_FILE" > gitee-release.json
          fi

          rm -f "$RELEASES_FILE"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload the DMG and checksum to Gitee
        id: gitee_asset
        env:
          API: https://gitee.com/api/v5/repos/${{ env.GITEE_OWNER }}/${{ env.GITEE_REPO }}
          RELEASE_ID: ${{ steps.gitee_release.outputs.release_id }}
          DMG: ${{ steps.asset.outputs.dmg }}
          ASSET_NAME: ${{ steps.asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          refresh_gitee_release() {
            local api_timeout="$1"
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time "$api_timeout" \
              "$API/releases/$RELEASE_ID" > gitee-release.json
          }

          remote_asset_exists_and_matches() {
            local path_name="$1"
            local expected_size="$2"
            local expected_sha="$3"
            local verify_timeout="$4"
            local existing existing_url existing_file
            local verify_started verify_elapsed verify_status actual_size actual_sha

            refresh_gitee_release 120 || return 1
            existing="$(jq -c --arg name "$path_name" \
              '(.assets // []) | map(select(.name == $name)) | first // empty' \
              gitee-release.json)"
            if [[ -z "$existing" ]]; then
              echo "Gitee asset is not visible yet: $path_name"
              return 1
            fi

            existing_url="$(jq -r '(.browser_download_url // .url // empty)' <<< "$existing")"
            if [[ -z "$existing_url" ]]; then
              echo "Gitee asset has no download URL yet: $path_name"
              return 1
            fi
            existing_file="$(mktemp)"
            verify_started="$(date +%s)"
            set +e
            curl --silent --show-error --fail --location --retry 3 \
              --connect-timeout 20 --max-time "$verify_timeout" \
              "$existing_url" --output "$existing_file"
            verify_status=$?
            set -e
            verify_elapsed=$(( $(date +%s) - verify_started ))

            if [[ "$verify_status" -ne 0 ]]; then
              echo "Gitee asset download failed: asset=$path_name curl_exit=$verify_status elapsed=${verify_elapsed}s"
              rm -f "$existing_file"
              return 1
            fi

            actual_size="$(stat -c '%s' "$existing_file")"
            if [[ "$actual_size" != "$expected_size" ]]; then
              echo "Gitee asset size mismatch: asset=$path_name expected=$expected_size actual=$actual_size elapsed=${verify_elapsed}s"
              rm -f "$existing_file"
              return 1
            fi

            actual_sha="$(sha256sum "$existing_file" | awk '{print $1}')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "Gitee asset SHA-256 mismatch: asset=$path_name expected=$expected_sha actual=$actual_sha elapsed=${verify_elapsed}s"
              rm -f "$existing_file"
              return 1
            fi

            rm -f "$existing_file"
            echo "Gitee asset verified: asset=$path_name bytes=$actual_size elapsed=${verify_elapsed}s"
            return 0
          }

          remove_existing_asset() {
            local path_name="$1"
            local existing existing_id

            refresh_gitee_release 120 || return 1
            existing="$(jq -c --arg name "$path_name" \
              '(.assets // []) | map(select(.name == $name)) | first // empty' \
              gitee-release.json)"
            [[ -n "$existing" ]] || return 0

            existing_id="$(jq -r '.id // empty' <<< "$existing")"
            [[ -n "$existing_id" ]] || {
              echo "Gitee asset $path_name exists but has no deletable id" >&2
              return 1
            }
            echo "Removing stale Gitee asset $path_name"
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 120 \
              --request DELETE \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              "$API/releases/$RELEASE_ID/attach_files/$existing_id" >/dev/null
          }

          upload_if_validated() {
            local path="$1"
            local expected_size="$2"
            local expected_sha="$3"
            local upload_connect_timeout="$4"
            local upload_timeout="$5"
            local verify_timeout="$6"
            local name upload_status upload_response upload_metrics
            local upload_started upload_elapsed
            local http_code time_dns time_connect time_tls time_first_byte
            local time_total size_upload speed_upload
            name="$(basename "$path")"

            for attempt in 1 2 3; do
              # An upload may have reached Gitee even when the response was
              # lost. Always query and verify before sending another copy.
              if remote_asset_exists_and_matches "$name" "$expected_size" "$expected_sha" "$verify_timeout"; then
                return 0
              fi

              remove_existing_asset "$name" || true

              echo "Uploading $name (attempt $attempt/3)"
              upload_response="$(mktemp)"
              upload_started="$(date +%s)"
              set +e
              upload_metrics="$(
                curl --silent --show-error --fail-with-body \
                  --connect-timeout "$upload_connect_timeout" --max-time "$upload_timeout" \
                  --request POST \
                  --form "access_token=$GITEE_TOKEN" \
                  --form "file=@$path" \
                  --output "$upload_response" \
                  --write-out '%{http_code}|%{time_namelookup}|%{time_connect}|%{time_appconnect}|%{time_starttransfer}|%{time_total}|%{size_upload}|%{speed_upload}' \
                  "$API/releases/$RELEASE_ID/attach_files"
              )"
              upload_status=$?
              set -e
              upload_elapsed=$(( $(date +%s) - upload_started ))
              IFS='|' read -r http_code time_dns time_connect time_tls time_first_byte time_total size_upload speed_upload <<< "$upload_metrics"
              echo "Gitee upload diagnostics: asset=$name attempt=$attempt curl_exit=$upload_status http=${http_code:-000} dns=${time_dns:-0}s connect=${time_connect:-0}s tls=${time_tls:-0}s first_byte=${time_first_byte:-0}s total=${time_total:-0}s uploaded=${size_upload:-0}B speed=${speed_upload:-0}B/s wall=${upload_elapsed}s"
              rm -f "$upload_response"
              if [[ "$upload_status" -ne 0 ]]; then
                echo "Gitee upload returned $upload_status; checking for a completed remote asset"
              fi

              # Treat a timeout/5xx as an unknown result, not an immediate
              # failure. The server may have stored the complete asset.
              if remote_asset_exists_and_matches "$name" "$expected_size" "$expected_sha" "$verify_timeout"; then
                return 0
              fi

              if [[ "$attempt" -lt 3 ]]; then
                sleep $((attempt * 20))
              fi
            done

            echo "Unable to upload and verify Gitee asset $name after 3 attempts" >&2
            return 1
          }

          CHECKSUM_SIZE="$(stat -c '%s' "$DMG.sha256")"
          CHECKSUM_SHA="$(sha256sum "$DMG.sha256" | awk '{print $1}')"
          upload_if_validated "$DMG" "${{ steps.asset.outputs.size }}" "${{ steps.asset.outputs.sha256 }}" 20 1200 1200
          upload_if_validated "$DMG.sha256" "$CHECKSUM_SIZE" "$CHECKSUM_SHA" 15 120 120
          refresh_gitee_release 120

          GITEE_DMG_URL="$(jq -r --arg name "$ASSET_NAME" \
            '(.assets // [])[] | select(.name == $name) | (.browser_download_url // .url // empty)' \
            gitee-release.json | head -n 1)"
          [[ "$GITEE_DMG_URL" == https://gitee.com/* ]] || {
            echo "Gitee did not return a usable HTTPS DMG URL" >&2
            exit 1
          }
          echo "url=$GITEE_DMG_URL" >> "$GITHUB_OUTPUT"

      - name: Verify Gitee contains the same DMG bytes
        env:
          GITEE_DMG_URL: ${{ steps.gitee_asset.outputs.url }}
          EXPECTED_SHA256: ${{ steps.asset.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.asset.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --retry 3 \
            --connect-timeout 20 --max-time 1200 \
            "$GITEE_DMG_URL" --output dist/gitee-verified.dmg
          [[ "$(stat -c '%s' dist/gitee-verified.dmg)" == "$EXPECTED_SIZE" ]] || {
            echo "Gitee DMG size differs from GitHub DMG" >&2
            exit 1
          }
          [[ "$(sha256sum dist/gitee-verified.dmg | awk '{print $1}')" == "$EXPECTED_SHA256" ]] || {
            echo "Gitee DMG SHA-256 differs from GitHub DMG" >&2
            exit 1
          }

      - name: Extract localized highlights from the release
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re

          with open("github-release.json", encoding="utf-8") as handle:
              body = json.load(handle).get("body") or ""

          def clean(line):
              line = re.sub(r"^\s*(?:[-*+]\s+|\d+[.)]\s+)", "", line.strip())
              line = re.sub(r"[`*_#]", "", line)
              line = re.sub(r"\s+", " ", line).strip()
              if not line:
                  return None
              if len(line) <= 120:
                  return line
              shortened = line[:119].rstrip()
              if re.search(r"[A-Za-z]", shortened):
                  word_boundary = shortened.rsplit(" ", 1)[0].rstrip()
                  if len(word_boundary) >= 40:
                      shortened = word_boundary
              return shortened + "…"

          def bullets(text):
              values = []
              for line in text.splitlines():
                  if re.match(r"^\s*(?:[-*+]\s+|\d+[.)]\s+)", line):
                      value = clean(line)
                      if value and value not in values:
                          values.append(value)
                  if len(values) == 2:
                      break
              return values

          zh_file = "dist/RELEASE_NOTES.zh-CN.md"
          en_file = "dist/RELEASE_NOTES.md"
          if os.path.exists(zh_file):
              with open(zh_file, encoding="utf-8") as handle:
                  zh = bullets(handle.read())
          else:
              zh = []
          if os.path.exists(en_file):
              with open(en_file, encoding="utf-8") as handle:
                  en = bullets(handle.read())
          else:
              en = []
          fallback = bullets(body)
          zh = zh or fallback
          en = en or fallback
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("zh_json=" + json.dumps(zh, ensure_ascii=False, separators=(",", ":")) + "\n")
              output.write("en_json=" + json.dumps(en, ensure_ascii=False, separators=(",", ":")) + "\n")
          PY

      - name: Refresh latest.json on GitHub main
        env:
          UPDATE_VERSION: ${{ steps.metadata.outputs.version }}
          UPDATE_BUILD: ${{ steps.metadata.outputs.build }}
          UPDATE_MINIMUM_SYSTEM_VERSION: ${{ steps.metadata.outputs.minimum_system_version }}
          UPDATE_PUBLISHED_AT: ${{ steps.metadata.outputs.published_at }}
          ALLOW_ROLLBACK: ${{ steps.metadata.outputs.allow_rollback }}
          DMG_PATH: ${{ steps.asset.outputs.dmg }}
          GITHUB_DMG_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.metadata.outputs.tag }}/${{ steps.asset.outputs.asset_name }}
          GITEE_DMG_URL: ${{ steps.gitee_asset.outputs.url }}
          UPDATE_RELEASE_PAGE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.metadata.outputs.tag }}
          UPDATE_HIGHLIGHTS_ZH_JSON: ${{ steps.notes.outputs.zh_json }}
          UPDATE_HIGHLIGHTS_EN_JSON: ${{ steps.notes.outputs.en_json }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          ALLOW_ROLLBACK="$ALLOW_ROLLBACK" UPDATE_VERSION="$UPDATE_VERSION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def version_key(value):
              parts = [int(part) for part in value.split(".")]
              return tuple(parts + [0] * (3 - len(parts)))

          current = json.loads(Path("updates/latest.json").read_text(encoding="utf-8"))["version"]
          candidate = os.environ["UPDATE_VERSION"]
          if os.environ.get("ALLOW_ROLLBACK", "false").lower() != "true" and version_key(candidate) < version_key(current):
              raise SystemExit(
                  f"Refusing to publish lower stable version {candidate}; current manifest is {current}. "
                  "Use allow_rollback only for an intentional rollback."
              )
          PY

          ./script/generate_update_manifest.sh
          ./script/verify_update_manifest.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          if git diff --cached --quiet; then
            echo "updates/latest.json is already current"
          else
            git commit -m "Publish update manifest for $UPDATE_VERSION"
            git push origin HEAD:main
          fi

      - name: Request Gitee mirror refresh
        id: mirror_refresh
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          RESPONSE_FILE="$(mktemp)"
          set +e
          MIRROR_METRICS="$(
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 120 \
              --request POST \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --output "$RESPONSE_FILE" \
              --write-out '%{http_code}|%{time_total}' \
              "$API/remote_mirror/pull"
          )"
          MIRROR_STATUS=$?
          set -e
          IFS='|' read -r MIRROR_HTTP MIRROR_TIME <<< "$MIRROR_METRICS"
          rm -f "$RESPONSE_FILE"

          if [[ "$MIRROR_STATUS" -eq 0 && "$MIRROR_HTTP" =~ ^2[0-9][0-9]$ ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Gitee mirror refresh accepted: http=$MIRROR_HTTP total=${MIRROR_TIME:-0}s"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Gitee mirror refresh is unavailable (curl_exit=$MIRROR_STATUS http=${MIRROR_HTTP:-000} total=${MIRROR_TIME:-0}s); the manifest will use the contents API immediately."
          fi

      - name: Ensure latest.json is available from Gitee raw
        env:
          MIRROR_REFRESH_AVAILABLE: ${{ steps.mirror_refresh.outputs.available }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          RAW_URL="https://gitee.com/$GITEE_OWNER/$GITEE_REPO/raw/main/updates/latest.json"
          EXPECTED_SHA="$(sha256sum updates/latest.json | awk '{print $1}')"
          RAW_FILE="$(mktemp)"
          FOUND=false

          raw_matches() {
            local phase="$1"
            local attempt="$2"
            local curl_status http_code actual_sha

            set +e
            http_code="$(
              curl --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                --connect-timeout 15 --max-time 60 \
                --output "$RAW_FILE" \
                --write-out '%{http_code}' \
                "$RAW_URL"
            )"
            curl_status=$?
            set -e

            actual_sha=""
            if [[ "$curl_status" -eq 0 && "$http_code" =~ ^2[0-9][0-9]$ && -s "$RAW_FILE" ]]; then
              actual_sha="$(sha256sum "$RAW_FILE" | awk '{print $1}')"
            fi
            if [[ "$actual_sha" == "$EXPECTED_SHA" ]]; then
              echo "Gitee raw manifest verified: phase=$phase attempt=$attempt http=$http_code sha256=$actual_sha"
              return 0
            fi

            echo "Gitee raw manifest pending: phase=$phase attempt=$attempt curl_exit=$curl_status http=${http_code:-000} expected_sha=$EXPECTED_SHA actual_sha=${actual_sha:-unavailable}"
            return 1
          }

          poll_raw() {
            local phase="$1"
            local attempts="$2"
            local delay="$3"
            local attempt

            for attempt in $(seq 1 "$attempts"); do
              if raw_matches "$phase" "$attempt"; then
                return 0
              fi
              if [[ "$attempt" -lt "$attempts" ]]; then
                sleep "$delay"
              fi
            done
            return 1
          }

          if raw_matches initial 1; then
            FOUND=true
          elif [[ "$MIRROR_REFRESH_AVAILABLE" == "true" ]]; then
            echo "Waiting briefly for the configured Gitee mirror"
            if poll_raw mirror 4 10; then
              FOUND=true
            fi
          else
            echo "Skipping the initial mirror wait because remote_mirror/pull is unavailable"
          fi

          # A Gitee repository without a configured remote mirror can still be
          # updated safely through its contents API. This only writes the
          # generated manifest and never uploads a guessed asset.
          if [[ "$FOUND" != true ]]; then
            FILE_INFO="$(mktemp)"
            WRITE_RESPONSE="$(mktemp)"
            set +e
            FILE_HTTP="$(
              curl --silent --show-error \
                --connect-timeout 15 --max-time 120 \
                --output "$FILE_INFO" \
                --write-out '%{http_code}' \
                "$API/contents/updates/latest.json?ref=main"
            )"
            FILE_STATUS=$?
            set -e
            FILE_SHA=""
            if [[ "$FILE_STATUS" -eq 0 && "$FILE_HTTP" =~ ^2[0-9][0-9]$ ]]; then
              FILE_SHA="$(jq -r '.sha // empty' "$FILE_INFO")"
            fi
            CONTENT="$(base64 < updates/latest.json | tr -d '\n')"

            set +e
            if [[ -n "$FILE_SHA" ]]; then
              WRITE_METHOD="PUT"
              WRITE_METRICS="$(
                curl --silent --show-error --fail-with-body \
                  --connect-timeout 15 --max-time 120 \
                  --request PUT \
                  --data-urlencode "access_token=$GITEE_TOKEN" \
                  --data-urlencode "content=$CONTENT" \
                  --data-urlencode "message=Publish update manifest for ${{ steps.metadata.outputs.version }}" \
                  --data-urlencode "branch=main" \
                  --data-urlencode "sha=$FILE_SHA" \
                  --output "$WRITE_RESPONSE" \
                  --write-out '%{http_code}|%{time_total}' \
                  "$API/contents/updates/latest.json"
              )"
            else
              WRITE_METHOD="POST"
              WRITE_METRICS="$(
                curl --silent --show-error --fail-with-body \
                  --connect-timeout 15 --max-time 120 \
                  --request POST \
                  --data-urlencode "access_token=$GITEE_TOKEN" \
                  --data-urlencode "content=$CONTENT" \
                  --data-urlencode "message=Publish update manifest for ${{ steps.metadata.outputs.version }}" \
                  --data-urlencode "branch=main" \
                  --output "$WRITE_RESPONSE" \
                  --write-out '%{http_code}|%{time_total}' \
                  "$API/contents/updates/latest.json"
              )"
            fi
            WRITE_STATUS=$?
            set -e
            IFS='|' read -r WRITE_HTTP WRITE_TIME <<< "$WRITE_METRICS"
            rm -f "$FILE_INFO" "$WRITE_RESPONSE"
            echo "Gitee contents API result: method=$WRITE_METHOD curl_exit=$WRITE_STATUS http=${WRITE_HTTP:-000} total=${WRITE_TIME:-0}s"
            if [[ "$WRITE_STATUS" -ne 0 || ! "$WRITE_HTTP" =~ ^2[0-9][0-9]$ ]]; then
              echo "Unable to publish updates/latest.json through the Gitee contents API" >&2
              exit 1
            fi
          fi

          if [[ "$FOUND" != true ]] && poll_raw contents 12 10; then
            FOUND=true
          fi
          rm -f "$RAW_FILE"
          [[ "$FOUND" == true ]] || {
            echo "Gitee raw manifest was not available or did not match GitHub" >&2
            exit 1
          }
          echo "Gitee manifest: $RAW_URL"

  sync-manifest:
    if: github.event_name == 'push'
    name: Sync latest.json to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: yangchen716
      GITEE_REPO: yuangui

    steps:
      - name: Check out the pushed main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate the Gitee token and manifest
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GITEE_TOKEN:-}" ]] || {
            echo "Repository secret GITEE_TOKEN is required" >&2
            exit 1
          }
          ./script/verify_update_manifest.sh

      - name: Create or update the Gitee raw manifest
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          RAW_URL="https://gitee.com/$GITEE_OWNER/$GITEE_REPO/raw/main/updates/latest.json"
          EXPECTED_SHA="$(sha256sum updates/latest.json | awk '{print $1}')"
          RAW_FILE="$(mktemp)"
          FOUND=false

          raw_matches() {
            local phase="$1"
            local attempt="$2"
            local curl_status http_code actual_sha

            set +e
            http_code="$(
              curl --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                --connect-timeout 15 --max-time 60 \
                --output "$RAW_FILE" \
                --write-out '%{http_code}' \
                "$RAW_URL"
            )"
            curl_status=$?
            set -e
            actual_sha=""
            if [[ "$curl_status" -eq 0 && "$http_code" =~ ^2[0-9][0-9]$ && -s "$RAW_FILE" ]]; then
              actual_sha="$(sha256sum "$RAW_FILE" | awk '{print $1}')"
            fi
            if [[ "$actual_sha" == "$EXPECTED_SHA" ]]; then
              echo "Gitee raw manifest verified: phase=$phase attempt=$attempt http=$http_code sha256=$actual_sha"
              return 0
            fi
            echo "Gitee raw manifest pending: phase=$phase attempt=$attempt curl_exit=$curl_status http=${http_code:-000} expected_sha=$EXPECTED_SHA actual_sha=${actual_sha:-unavailable}"
            return 1
          }

          poll_raw() {
            local phase="$1"
            local attempts="$2"
            local delay="$3"
            local attempt

            for attempt in $(seq 1 "$attempts"); do
              if raw_matches "$phase" "$attempt"; then
                return 0
              fi
              if [[ "$attempt" -lt "$attempts" ]]; then
                sleep "$delay"
              fi
            done
            return 1
          }

          MIRROR_RESPONSE="$(mktemp)"
          set +e
          MIRROR_METRICS="$(
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 120 \
              --request POST \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --output "$MIRROR_RESPONSE" \
              --write-out '%{http_code}|%{time_total}' \
              "$API/remote_mirror/pull"
          )"
          MIRROR_STATUS=$?
          set -e
          IFS='|' read -r MIRROR_HTTP MIRROR_TIME <<< "$MIRROR_METRICS"
          rm -f "$MIRROR_RESPONSE"
          if [[ "$MIRROR_STATUS" -eq 0 && "$MIRROR_HTTP" =~ ^2[0-9][0-9]$ ]]; then
            MIRROR_AVAILABLE=true
            echo "Gitee mirror refresh accepted: http=$MIRROR_HTTP total=${MIRROR_TIME:-0}s"
          else
            MIRROR_AVAILABLE=false
            echo "::notice::Gitee mirror refresh is unavailable (curl_exit=$MIRROR_STATUS http=${MIRROR_HTTP:-000} total=${MIRROR_TIME:-0}s); using the contents API immediately."
          fi

          if raw_matches initial 1; then
            FOUND=true
          elif [[ "$MIRROR_AVAILABLE" == true ]]; then
            if poll_raw mirror 4 10; then
              FOUND=true
            fi
          else
            echo "Skipping the initial mirror wait because remote_mirror/pull is unavailable"
          fi

          if [[ "$FOUND" != true ]]; then
            FILE_INFO="$(mktemp)"
            curl --silent --show-error --connect-timeout 15 --max-time 120 \
              "$API/contents/updates/latest.json?ref=main" > "$FILE_INFO" || true
            FILE_SHA="$(jq -r '.sha // empty' "$FILE_INFO" 2>/dev/null || true)"
            CONTENT="$(base64 < updates/latest.json | tr -d '\n')"
            if [[ -n "$FILE_SHA" ]]; then
              echo "Publishing Gitee manifest through contents API: method=PUT"
              curl --silent --show-error --fail-with-body \
                --connect-timeout 15 --max-time 120 \
                --request PUT \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "content=$CONTENT" \
                --data-urlencode "message=Sync update manifest" \
                --data-urlencode "branch=main" \
                --data-urlencode "sha=$FILE_SHA" \
                "$API/contents/updates/latest.json" >/dev/null
            else
              echo "Publishing Gitee manifest through contents API: method=POST"
              curl --silent --show-error --fail-with-body \
                --connect-timeout 15 --max-time 120 \
                --request POST \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "content=$CONTENT" \
                --data-urlencode "message=Create update manifest" \
                --data-urlencode "branch=main" \
                "$API/contents/updates/latest.json" >/dev/null
            fi
            echo "Gitee contents API accepted the manifest update"
          fi

          if [[ "$FOUND" != true ]] && poll_raw contents 12 10; then
            FOUND=true
          fi
          rm -f "$RAW_FILE"
          [[ "$FOUND" == true ]] || {
            echo "Gitee raw manifest was not created or does not match GitHub" >&2
            exit 1
          }
          echo "Gitee manifest: $RAW_URL"
